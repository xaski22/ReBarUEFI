name: Build ReBarDxe EFI

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev python3 nasm iasl git

      - name: Checkout EDK2
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/tianocore/edk2.git
          cd edk2
          make -C BaseTools -j$(nproc)

      - name: Checkout ReBarUEFI
        uses: actions/checkout@v4
        with:
          path: edk2/ReBarUEFI

      - name: Build ReBarDxe EFI
        run: |
          cd edk2
          source edksetup.sh
          build -p ReBarUEFI/ReBarUEFI.dsc -m ReBarUEFI/ReBarDxe/ReBarDxe.inf -a X64 -b RELEASE -t GCC5

      - name: Upload ReBarDxe.efi
        uses: actions/upload-artifact@v4
        with:
          name: ReBarDxe-EFI
          path: edk2/Build/ReBarUEFI/RELEASE_GCC5/X64/ReBarDxe.efi

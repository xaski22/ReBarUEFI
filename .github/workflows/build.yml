name: Build ReBarDxe EFI

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev python3 nasm iasl git

      - name: Run build script
        run: |
          chmod +x buildffs.sh
          ./buildffs.sh

      - name: Find and Upload ReBarDxe EFI
        uses: actions/upload-artifact@v4
        with:
          name: ReBarDxe-EFI
          path: |
            edk2/Build/**/ReBarDxe.efi
            **/ReBarDxe.efi
